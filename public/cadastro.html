      <div id="bloc1" class="cadastro">
         <a href="index.html" class="link-logo" aria-label="Ir para a página inicial">
            <div id="logo"></div>
         </a>
         <div id="inputs"><!-- separei os inputs em caixas pra ficar mais facil de mexer -->


            <div class="caixa" id="caixaNome" class="caixa_input">
               <p class="tituloInp">Nome:</p>
               <input id="inpNome" class="input" oninput="validarNome()" type="text">
            </div>

            <div class="caixa" id="caixaEmail" class="caixa_input">
               <p class="tituloInp">Email:</p>
               <input id="inpEmail" class="input" oninput="validarEmail()" type="text">
            </div>

            <div class="caixa" id="caixaCnpj" class="caixa_input">
               <p class="tituloInp">CNPJ:</p>
               <input id="inpCnpj" class="input" oninput="validarCnpj()" type="text">
            </div>

            <div class="caixa" id="caixaCidade">
               <p class="tituloInp">Cidade:</p>
               <input id="inpCidade" class="input" oninput="validarCidade()" type="text">

            </div>

            <div class="caixa" id="caixaSenha">
               <p class="tituloInp">Senha:</p>
               <input id="inpSenha" class="input" oninput="validarSenha()" type="text">
            </div>

            <div class="caixa" id="caixaConfirmarSenha">
               <p class="tituloInp">Confirmar senha:</p>
               <input id="inpConfSenha" class="input" oninput="validarConfSenha()" type="text">
            </div>

         </div>

         <div class="caixa" id="caixaBotao"><!-- caixa para o botao -->
            <button class="botao" onclick="cadastrar()">CADASTRAR-SE</button>
            <p class="texto">Já tem uma conta? <b><a href="login.html">Entrar</a></b></p>
         </div>

      </div>

      <div id="bloc2" class="cadastro">
         <p class="texto-cadastro">Cadastro.</p>
         <div class="cadastro" id="logoFundo"></div>
      </div>

   </div>
