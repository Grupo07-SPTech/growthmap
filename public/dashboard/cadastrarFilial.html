  <head>
    <meta charset="UTF-8" />

    />

      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>

    </button>
    <div class="sidebar">
      <img
        class="logo"
        src="../assets/logo/logos-sem-fundo/logo_com_escrita_vermelho.png"
        alt="Logo"
      />
      <div class="nav-indicador" id="nav-indicador"></div>

      <div class="nav-item ativo">
        <a href="./acessoRapido.html"><i class="fi fi-rr-apps"></i></a>
      </div>
      <div class="nav-item">
        <a href="./painelEventos.html"><i class="fi fi-rr-calendar"></i></a>
      </div>
      <div class="nav-item ativo">
        <a href="./filiais.html"><i class="fi fi-rr-home"></i></a>
      </div>

        <a href="./dashboardDiretorGeral.html"
          ><i class="fi fi-rr-chart-pie-alt"></i
        ></a>
      </div>

        <a href="./usuarios.html"><i class="fi fi-rr-users"></i></a>
      </div>

        <div class="perfil"></div>
      </a>
      <div class="sair"><a href="../index.html">Sair</a></div>
    </div>

    <div class="conteudo">
      <h1 class="titulo">Cadastro de <span>Filial</span></h1>

      <div class="card form-card">
        <form id="form-filial" onreset="limparErrosFormulario()" novalidate>
          <div class="form-grupo">
            <label>Nome da Filial:</label>
            <input
              type="text"
              id="f_nome"
              required
              placeholder="Ex.: Growth Map - Unidade Centro"
            />
          </div>

          <div class="form-linha">
            <div class="form-grupo">
              <label>CNPJ:</label>
              <input
                type="text"
                id="f_cnpj"
                required
                placeholder="00.000.000/0001-00"
                oninput="aplicarMascaraCnpj()"
              />
            </div>
            <div class="form-grupo">
              <label>Telefone:</label>
              <input
                type="text"
                id="f_tel"
                placeholder="(00) 00000-0000"
                oninput="aplicarMascaraTelefone()"
              />
            </div>
          </div>

          <div class="form-linha">
            <div class="form-grupo" style="flex: 1">
              <label>CEP:</label>
              <input
                type="text"
                id="f_cep"
                placeholder="00000-000"
                oninput="aplicarMascaraCep(); buscarEnderecoPorCep()"
              />
            </div>
            <div class="form-grupo" style="flex: 3">
              <label>Logradouro (Rua, Av., etc.):</label>
              <input type="text" id="f_rua" placeholder="Ex.: Av. Industrial" />
            </div>
          </div>

          <div class="form-linha">
            <div class="form-grupo" style="flex: 1">
              <label>Número:</label>
              <input type="text" id="f_num" placeholder="Ex.: 3330" />
            </div>
            <div class="form-grupo" style="flex: 2">
              <label>Bairro:</label>
              <input type="text" id="f_bairro" placeholder="Ex.: Centro" />
            </div>
          </div>

          <div class="form-linha">
            <div class="form-grupo" style="flex: 2">
              <label>Cidade:</label>
              <input type="text" id="f_cidade" placeholder="Ex.: Santo André" />
            </div>
            <div class="form-grupo" style="flex: 1">
              <label>Estado (UF):</label>
              <select id="f_estado" required>
                <option value="" disabled selected>Selecione...</option>
                <option value="AC">AC</option>
                <option value="AL">AL</option>
                <option value="AP">AP</option>
                <option value="AM">AM</option>
                <option value="BA">BA</option>
                <option value="CE">CE</option>
                <option value="DF">DF</option>
                <option value="ES">ES</option>
                <option value="GO">GO</option>
                <option value="MA">MA</option>
                <option value="MT">MT</option>
                <option value="MS">MS</option>
                <option value="MG">MG</option>
                <option value="PA">PA</option>
                <option value="PB">PB</option>
                <option value="PR">PR</option>
                <option value="PE">PE</option>
                <option value="PI">PI</option>
                <option value="RJ">RJ</option>
                <option value="RN">RN</option>
                <option value="RS">RS</option>
                <option value="RO">RO</option>
                <option value="RR">RR</option>
                <option value="SC">SC</option>
                <option value="SP">SP</option>
                <option value="SE">SE</option>
                <option value="TO">TO</option>
              </select>
            </div>
          </div>

          <div class="form-acoes">
            <button type="button" class="btn-salvar" onclick="cadastrar()">Cadastrar Filial</button>
            <button type="reset" class="btn-limpar">Limpar</button>
          </div>
        </form>
      </div>
    </div>

    <script src="./js/menu.js"></script>

    <script>
      let codigoIbgeMunicipio = "";

      function validarNome(f_nome, id) {
        f_nome = f_nome.trim();

        if (f_nome.length < 3) {
          mostrarErroCampo(id, "Digite o nome da filial com pelo menos 3 caracteres.");
          return false;
        }

        limparErroCampo(id);
        return true;
      }

      function validarCnpj(f_cnpj, id) {
        f_cnpj = f_cnpj.replace(/\D/g, "");

        if (f_cnpj.length != 14) {
          mostrarErroCampo(id, "Confira o CNPJ. Ele deve ter 14 números e não pode repetir o mesmo número.");
          return false;
        }

        let todosIguais = true;

        for (let i = 1; i < f_cnpj.length; i++) {
          if (f_cnpj[i] != f_cnpj[0]) {
            todosIguais = false;
          }
        }
        if (todosIguais) {
          mostrarErroCampo(id, "Confira o CNPJ. Ele deve ter 14 números e não pode repetir o mesmo número.");
          return false;
        }

        limparErroCampo(id);
        return true;
      }

      function validarTelefone(f_tel, id) {
        f_tel = f_tel.replace(/\D/g, "");

        if (f_tel.length == 0) {
          limparErroCampo(id);
          return true;
        }

        if (f_tel.length != 10 && f_tel.length != 11) {
          mostrarErroCampo(id, "Confira o telefone. Inclua o DDD e informe 10 ou 11 números.");
          return false;
        }

        limparErroCampo(id);
        return true;
      }

      function validarCep(f_cep, id) {
        f_cep = f_cep.replace(/\D/g, "");

        if (f_cep.length == 0) {
          limparErroCampo(id);
          return true;
        }

        if (f_cep.length != 8) {
          mostrarErroCampo(id, "Confira o CEP. Ele deve conter 8 números.");
          return false;
        }

        limparErroCampo(id);
        return true;
      }

      function validarRua(f_rua, id) {
        f_rua = f_rua.trim();

        if (f_rua.length == 0) {
          limparErroCampo(id);
          return true;
        }

        let partesRua = f_rua.toLowerCase().split(" ");
        let tipoLogradouro = partesRua[0];
        let temTipoLogradouro;

        switch (tipoLogradouro) {
          case "rua":
          case "r":
          case "r.":
          case "avenida":
          case "av":
          case "av.":
          case "alameda":
          case "al":
          case "al.":
          case "travessa":
          case "trav":
          case "trav.":
          case "trv":
          case "trv.":
          case "rodovia":
          case "rod":
          case "rod.":
          case "estrada":
          case "estr":
          case "estr.":
          case "praça":
          case "pca":
          case "pca.":
          case "pc":
          case "pc.":
          case "largo":
          case "lg":
          case "lg.":
          case "viela":
          case "via":
          case "passagem":
            temTipoLogradouro = true;
            break;
          default:
            temTipoLogradouro = false;
        }

        if (f_rua.length < 2 || !temTipoLogradouro || partesRua.length < 2) {
          mostrarErroCampo(id, "Informe um tipo de via, como Rua, Avenida ou Travessa, seguido do nome.");
          return false;
        }

        limparErroCampo(id);
        return true;
      }

      function validarNumero(f_num, id) {
        f_num = f_num.trim();

        if (f_num.length == 0) {
          limparErroCampo(id);
          return true;
        }

        let numeroValido = true;

        for (let i = 0; i < f_num.length; i++) {
          let caractere = f_num[i];
          let ehNumero = caractere >= "0" && caractere <= "9";
          let ehLetra =
            (caractere >= "A" && caractere <= "Z") ||
            (caractere >= "a" && caractere <= "z");

          if (!ehNumero && !(ehLetra && i == f_num.length - 1)) {
            numeroValido = false;
          }
        }

        if (!numeroValido) {
          mostrarErroCampo(id, "Confira o número do endereço. Use números e, se necessário, uma letra no final.");
          return false;
        }

        limparErroCampo(id);
        return true;
      }

      function validarBairro(f_bairro, id) {
        if (f_bairro.trim().length > 0 && f_bairro.trim().length < 2) {
          mostrarErroCampo(id, "Informe um bairro com pelo menos 2 caracteres ou deixe em branco.");
          return false;
        }

        limparErroCampo(id);
        return true;
      }

      function validarCidade(f_cidade, id) {
        if (f_cidade.trim().length > 0 && f_cidade.trim().length < 2) {
          mostrarErroCampo(id, "Informe uma cidade com pelo menos 2 caracteres ou deixe em branco.");
          return false;
        }

        limparErroCampo(id);
        return true;
      }

      function validarEstado(f_estado, id) {
        if (f_estado.length != 2 || f_estado != f_estado.toUpperCase()) {
          mostrarErroCampo(id, "Selecione o estado da filial.");
          return false;
        }

        limparErroCampo(id);
        return true;
      }

      function mostrarErroCampo(id, mensagem) {
        let campo = window[id];
        let grupo = campo.closest(".form-grupo");
        let erro = window[id + "-erro"];

        if (!erro) {
          erro = document.createElement("small");
          erro.id = id + "-erro";
          erro.className = "mensagem-erro";
          erro.setAttribute("role", "alert");
          campo.insertAdjacentElement("afterend", erro);
        }

        erro.textContent = mensagem;
        campo.setAttribute("aria-invalid", "true");
        campo.setAttribute("aria-describedby", erro.id);
        grupo.classList.add("campo-invalido");
      }

      function limparErroCampo(id) {
        let campo = window[id];
        let erro = window[id + "-erro"];

        if (erro) erro.remove();
        campo.removeAttribute("aria-invalid");
        campo.removeAttribute("aria-describedby");
        campo.closest(".form-grupo").classList.remove("campo-invalido");
      }

      function obterDigitos(valor, limite) {
        let numeros = "";

        for (let i = 0; i < valor.length; i++) {
          let caractere = valor[i];

          if (caractere >= "0" && caractere <= "9") {
            numeros += caractere;
          }

          if (numeros.length == limite) {
            break;
          }
        }

        return numeros;
      }

      function aplicarMascaraTelefone() {
        let f_tel = window.f_tel;
        let numeros = obterDigitos(f_tel.value, 11);
        let formatado = "";

        if (numeros.length > 0) {
          formatado = "(" + numeros.slice(0, 2);
        }
        if (numeros.length >= 3) {
          formatado += ") " + numeros.slice(2, numeros.length == 11 ? 7 : 6);
        }
        if (numeros.length > 6 && numeros.length <= 10) {
          formatado += "-" + numeros.slice(6);
        } else if (numeros.length > 7) {
          formatado += "-" + numeros.slice(7);
        }

        f_tel.value = formatado;
      }

      function aplicarMascaraCnpj() {
        let f_cnpj = window.f_cnpj;
        let numeros = obterDigitos(f_cnpj.value, 14);
        let formatado = numeros.slice(0, 2);

        if (numeros.length > 2) {
          formatado += "." + numeros.slice(2, 5);
        }
        if (numeros.length > 5) {
          formatado += "." + numeros.slice(5, 8);
        }
        if (numeros.length > 8) {
          formatado += "/" + numeros.slice(8, 12);
        }
        if (numeros.length > 12) {
          formatado += "-" + numeros.slice(12, 14);
        }

        f_cnpj.value = formatado;
      }

      function aplicarMascaraCep() {
        let f_cep = window.f_cep;
        let numeros = obterDigitos(f_cep.value, 8);
        let formatado = numeros.slice(0, 5);

        if (numeros.length > 5) {
          formatado += "-" + numeros.slice(5, 8);
        }

        f_cep.value = formatado;
      }

      async function buscarEnderecoPorCep() {
        let f_cep = window.f_cep;
        let cep = obterDigitos(f_cep.value, 8);

        if (cep.length != 8) {
          return;
        }

        try {
          let resposta = await fetch(`https://viacep.com.br/ws/${cep}/json/`);

          if (!resposta.ok) {
            throw new Error("Falha na consulta do CEP");
          }

          let endereco = await resposta.json();

          if (endereco.erro) {
            mostrarErroCampo("f_cep", "CEP não encontrado.");
            return;
          }

          f_rua.value = endereco.logradouro || "";
          f_bairro.value = endereco.bairro || "";
          f_cidade.value = endereco.localidade || "";
          f_estado.value = endereco.uf || "";
          codigoIbgeMunicipio = endereco.ibge || "";
        } catch (erro) {
          mostrarErroCampo("f_cep", "Não foi possível consultar o CEP. Tente novamente.");
        }
      }

      function cadastrar() {
        let formularioValido = true;

        if (!validarNome(f_nome.value, "f_nome")) formularioValido = false;
        if (!validarCnpj(f_cnpj.value, "f_cnpj")) formularioValido = false;
        if (!validarTelefone(f_tel.value, "f_tel")) formularioValido = false;
        if (!validarCep(f_cep.value, "f_cep")) formularioValido = false;
        if (!validarRua(f_rua.value, "f_rua")) formularioValido = false;
        if (!validarNumero(f_num.value, "f_num")) formularioValido = false;
        if (!validarBairro(f_bairro.value, "f_bairro")) formularioValido = false;
        if (!validarCidade(f_cidade.value, "f_cidade")) formularioValido = false;
        if (!validarEstado(f_estado.value, "f_estado")) formularioValido = false;

        if (!formularioValido) {
          return;
        }

        let nome = f_nome.value.trim();
        let cnpj = obterDigitos(f_cnpj.value, 14);
        let telefone = obterDigitos(f_tel.value, 11);
        let cep = obterDigitos(f_cep.value, 8);
        let rua = f_rua.value.trim();
        let numero = f_num.value.trim();
        let bairro = f_bairro.value.trim();
        let cidade = f_cidade.value.trim();
        let estado = f_estado.value;
        let idEmpresa = sessionStorage.getItem("ID_EMPRESA");

        return fetch("/filial/cadastrar", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            nome: nome,
            cnpj: cnpj,
            telefone: telefone,
            cep: cep,
            rua: rua,
            numero: numero,
            bairro: bairro,
            cidade: cidade,
            estado: estado,
            coMunicipio: codigoIbgeMunicipio,
            idEmpresa: idEmpresa,
          }),
        })
          .then(function (resposta) {
            if (resposta.ok) {
              alert("Filial cadastrada com sucesso!");
              window.location = "./filiais.html";
            } else {
              resposta.text().then(function (texto) {
                alert(texto);
              });
            }
          })
          .catch(function (erro) {
            console.log("#ERRO:", erro);
            alert("Não foi possível cadastrar a filial. Tente novamente.");
          });
      }

      function limparErrosFormulario() {
        ["f_nome", "f_cnpj", "f_tel", "f_cep", "f_rua", "f_num", "f_bairro", "f_cidade", "f_estado"].forEach(limparErroCampo);
      }
    </script>
  </body>
</html>
