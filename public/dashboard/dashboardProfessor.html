    <script src="../js/menu.js"></script>
    <script>
        // Base de dados simulada para vincular Municípios ao Estado correspondente
        const municipiosPorEstado = {
            SP: [
                { value: "mairipora", text: "Mairiporã" },
                { value: "atibaia", text: "Atibaia" },
                { value: "guarulhos", text: "Guarulhos" },
                { value: "francisco-morato", text: "Francisco Morato" },
                { value: "campinas", text: "Campinas" },
                { value: "santos", text: "Santos" },
                { value: "sao-paulo", text: "São Paulo (Capital)" }
            ],
            RJ: [
                { value: "rio-de-janeiro", text: "Rio de Janeiro (Capital)" },
                { value: "niteroi", text: "Niterói" },
                { value: "petropolis", text: "Petrópolis" },
                { value: "duque-de-caxias", text: "Duque de Caxias" }
            ],
            MG: [
                { value: "belo-horizonte", text: "Belo Horizonte (Capital)" },
                { value: "uberlandia", text: "Uberlândia" },
                { value: "ouropreto", text: "Ouro Preto" },
                { value: "juiz-de-fora", text: "Juiz de Fora" }
            ],
            PR: [
                { value: "curitiba", text: "Curitiba (Capital)" },
                { value: "londrina", text: "Londrina" },
                { value: "maringa", text: "Maringá" },
                { value: "foz-do-iguacu", text: "Foz do Iguaçu" }
            ]
        };

        // Função que atualiza as opções do select de municípios baseado no estado selecionado
        function atualizarMunicipios() {
            const selectEstado = document.getElementById('select-estado');
            const selectMunicipio = document.getElementById('select-municipio');
            const estadoSelecionado = selectEstado.value;

            // Limpa as opções atuais
            selectMunicipio.innerHTML = '';

            // Busca os municípios do estado correspondente
            const listaMunicipios = municipiosPorEstado[estadoSelecionado] || [];

            // Popula o select de municípios
            listaMunicipios.forEach(mun => {
                const option = document.createElement('option');
                option.value = mun.value;
                option.textContent = mun.text;
                selectMunicipio.appendChild(option);
            });
        }

        // Executa ao carregar a página para preencher com o estado padrão (SP)
        window.onload = function() {
            atualizarMunicipios();
        };

        // Inicialização do Gráfico de Radar
        const ctxRadar = document.getElementById('radarChart').getContext('2d');
        new Chart(ctxRadar, {
            type: 'radar',
            data: {
                labels: ['Matemática', 'Linguagens', 'Humanas', 'Natureza', 'Redação'],
                datasets: [{
                    label: 'Município Selecionado',
                    data: [512, 505, 498, 480, 580],
                    backgroundColor: 'rgba(122, 31, 61, 0.2)',
                    borderColor: '#7a1f3d',
                    borderWidth: 2
                }, {
                    label: 'Média do Estado',
                    data: [554, 530, 520, 510, 620],
                    backgroundColor: 'rgba(31, 31, 122, 0.05)',
                    borderColor: '#1f1f7a',
                    borderWidth: 1.5,
                    borderDash: [4, 4]
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: { r: { suggestedMin: 400, suggestedMax: 700 } }
            }
        });

        // Inicialização do Gráfico de Barras da Redação
        const ctxBar = document.getElementById('barRedacaoChart').getContext('2d');
        new Chart(ctxBar, {
            type: 'bar',
            data: {
                labels: ['Comp. 1', 'Comp. 2', 'Comp. 3 (Arg.)', 'Comp. 4', 'Comp. 5'],
                datasets: [{
                    data: [145, 120, 110, 130, 135],
                    backgroundColor: [
                        'rgba(122, 31, 61, 0.7)',
                        'rgba(122, 31, 61, 0.7)',
                        'rgba(220, 38, 38, 0.85)',
                        'rgba(122, 31, 61, 0.7)',
                        'rgba(122, 31, 61, 0.7)'
                    ],
                    borderColor: '#7a1f3d',
                    borderWidth: 1
                }]
            },
            options: {
                indexAxis: 'y',
                responsive: true,
                maintainAspectRatio: false,
                scales: { x: { max: 200, beginAtZero: true } },
                plugins: { legend: { display: false } }
            }
        });
    </script>
</body>
</html>
