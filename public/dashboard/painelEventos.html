<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Growth Map | Painel de eventos</title>
  <link rel="stylesheet"
    href="https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
  <link rel="stylesheet" href="./css/painelEventos.css">
  <link rel="icon" href="../assets/logo/logos-sem-fundo/logo_com_escrita_all-branco.png">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

  <!-- Botão do menu móvel (sem overlay) -->
  <button class="btn-menu" id="btn-menu" aria-label="Abrir ou fechar menu">
    <i class="fi fi-rr-menu-burger"></i>
  </button>

  <div class="sidebar">
    <img class="logo" src="../assets/logo/logos-sem-fundo/logo_com_escrita_vermelho.png" alt="Logo">
    <div class="nav-indicador" id="nav-indicador"></div>

    <div class="nav-item">
      <a href="./acessoRapido.html"><i class="fi fi-rr-apps"></i></a>
    </div>
    <div class="nav-item ativo">
      <a href="./painelEventos.html"><i class="fi fi-rr-calendar"></i></a>
    </div>
    <div class="nav-item">
      <a href="./filiais.html"><i class="fi fi-rr-home"></i></a>
    </div>
    <div class="nav-item">
      <a href="./dashboardDiretorGeral.html"><i class="fi fi-rr-chart-pie-alt"></i></a>
    </div>
    <div class="nav-item">
      <a href="./usuarios.html"><i class="fi fi-rr-users"></i></a>
    </div>
    <a href="perfilUsuario.html">
      <div class="perfil"></div>
    </a>
    <div class="sair"><a href="../index.html">Sair</a></div>
  </div>

  <div class="conteudo">
    <h1 class="titulo">Painel de <span>eventos</span></h1>

    <div class="topo">
      <h2 class="rotulo">Eventos próximos:</h2>
      <div class="card" id="eventos-proximos"></div>
    </div>

    <div class="baixo">
      <div class="card cal-box">
        <div class="cal-titulo">CALENDÁRIO</div>
        <div class="cal-nav">
          <button id="mes-ant">&lt;</button>
          <span class="mes" id="mes-nome"></span>
          <button id="mes-prox">&gt;</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>DOM</th>
              <th>SEG</th>
              <th>TER</th>
              <th>QUA</th>
              <th>QUI</th>
              <th>SEX</th>
              <th>SAB</th>
            </tr>
          </thead>
          <tbody id="cal-corpo"></tbody>
        </table>
      </div>

      <div class="card painel">
        <div class="painel-topo">
          <div>
            <div class="painel-rotulo">Eventos do dia</div>
            <div class="painel-data" id="painel-data"></div>
          </div>
          <button class="btn-editar" id="btn-editar">Editar</button>
        </div>

        <div class="lista-tarefas" id="lista-tarefas"></div>

        <button class="btn-add" id="btn-add">+ Adicionar evento</button>

        <form class="form-tarefa" id="form-tarefa">
          <div class="form-data">Cadastrar em: <strong id="form-data"></strong></div>
          <label>Nome da tarefa:
            <input type="text" id="f-nome" required placeholder="Ex.: Resolver lista de física">
          </label>
          <label>Área de conhecimento:
            <select id="f-area" required>
              <option value="Ciências Exatas">Ciências Exatas</option>
              <option value="Ciências Naturais">Ciências Naturais</option>
              <option value="Ciências Humanas">Ciências Humanas</option>
              <option value="Linguagens">Linguagens</option>
            </select>
          </label>
          <div class="form-acoes">
            <button type="submit" class="btn-salvar">Salvar</button>
            <button type="button" class="btn-cancelar" id="btn-cancelar">Cancelar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    const chave = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    const daChave = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
    const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
    const rotuloDia = d => cap(d.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' }));
    const somaDias = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };

    const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
    const chaveHoje = chave(hoje);

    let proxId = 1;
    const itens = [
      { id: proxId++, tipo: 'evento', nome: 'Reunião de Alinhamento da Redação', area: 'Linguagens', data: chaveHoje, rotulo: 'Reunião' },
      { id: proxId++, tipo: 'evento', nome: 'Plantão de Dúvidas de Química', area: 'Ciências Naturais', data: chaveHoje, rotulo: 'Apoio' },
      { id: proxId++, tipo: 'evento', nome: 'Entrega: Exercícios FUVEST pag 57-61', area: 'Linguagens', data: chaveHoje, rotulo: 'Entrega' },
      { id: proxId++, tipo: 'evento', nome: 'Simulado ENEM', data: chave(somaDias(hoje, 1)), rotulo: 'Obrigatório' },
      { id: proxId++, tipo: 'evento', nome: 'Simulado ENEM - Dia 01', data: chave(somaDias(hoje, 6)), rotulo: 'Obrigatório' },
      { id: proxId++, tipo: 'evento', nome: 'Simulado FUVEST', data: chave(somaDias(hoje, 20)), rotulo: 'Obrigatório' }
    ];

    let mesVisivel = new Date(hoje.getFullYear(), hoje.getMonth(), 1);
    let diaSelecionado = chaveHoje;
    let modoEdicao = false;

    const ehTarefa = i => i.tipo === 'tarefa' && !i.soEvento;

    function obterIcone(tipo) {
      if (tipo === 'prova') return '<i class="fi fi-rr-edit"></i>';
      if (tipo === 'evento') return '<i class="fi fi-rr-calendar"></i>';
      return '<i class="fi fi-rr-book-alt"></i>';
    }

    function renderEventos() {
      const alvo = document.getElementById('eventos-proximos');
      const limite = somaDias(hoje, 7);
      const proximos = itens
        .filter(i => { const d = daChave(i.data); return d >= hoje && d <= limite; })
        .sort((a, b) => a.data.localeCompare(b.data));

      if (!proximos.length) {
        alvo.innerHTML = '<p class="vazio">Nenhum evento nos próximos 7 dias.</p>';
        return;
      }

      let html = '', ultimo = '';
      proximos.forEach(i => {
        if (i.data !== ultimo) {
          html += `<h3 class="dia-titulo">${rotuloDia(daChave(i.data))}</h3>`;
          ultimo = i.data;
        }

        const icone = obterIcone(i.tipo);

        let badge = i.rotulo, cls = 'badge';
        if (i.tipo === 'tarefa') {
          badge = i.feita ? 'Concluído' : 'Pendente';
          if (i.feita) cls += ' concluido';
        }

        html += `<div class="evento">
      <div class="icone">${icone}</div>
      <div class="info">
        <div class="nome">${i.nome}</div>
        <span class="${cls}">${badge}</span>
      </div>
    </div>`;
      });

      alvo.innerHTML = html;
    }

    const form = document.getElementById('form-tarefa');
    const btnAdd = document.getElementById('btn-add');
    const btnEditar = document.getElementById('btn-editar');

    function renderPainel() {
      const lista = document.getElementById('lista-tarefas');
      const dataSel = daChave(diaSelecionado);
      const passado = diaSelecionado < chaveHoje;

      document.getElementById('painel-data').textContent =
        (diaSelecionado === chaveHoje ? 'Hoje · ' : '') + rotuloDia(dataSel);
      document.getElementById('form-data').textContent = rotuloDia(dataSel);

      btnAdd.style.display = passado ? 'none' : '';
      if (passado) form.classList.remove('aberto');

      const doDia = itens.filter(i => i.data === diaSelecionado);
      if (!doDia.length) {
        lista.innerHTML = '<p class="vazio">Nada marcado para este dia.</p>';
        return;
      }

      lista.innerHTML = doDia.map(i => {
        if (!ehTarefa(i)) {
          const classeIcone = i.tipo === 'prova' ? 'fi-rr-edit' : i.tipo === 'evento' ? 'fi-rr-calendar' : 'fi-rr-book-alt';
          return `<div class="tarefa fixa">
        <span class="icone-mini"><i class="fi ${classeIcone}"></i></span>
        <span class="txt">${i.nome}<small>${i.rotulo || ''}</small></span>
      </div>`;
        }
        if (modoEdicao) {
          return `<div class="tarefa editando" data-id="${i.id}">
        <input class="edit-nome" type="text" value="${i.nome.replace(/"/g, '&quot;')}">
        <button type="button" class="btn-excluir" title="Excluir tarefa"><i class="fi fi-rr-trash"></i></button>
      </div>`;
        }
        return `<div class="tarefa ${i.feita ? 'feita' : ''}" data-id="${i.id}">
      <span class="check">${i.feita ? '<i class="fi fi-rr-cross-small"></i>' : ''}</span>
      <span class="txt">${i.nome}<small>${i.area || ''}</small></span>
    </div>`;
      }).join('');
    }

    const listaEl = document.getElementById('lista-tarefas');

    listaEl.addEventListener('click', e => {
      const linha = e.target.closest('.tarefa[data-id]');
      if (!linha) return;
      const id = Number(linha.dataset.id);

      if (e.target.closest('.btn-excluir')) {
        itens.splice(itens.findIndex(i => i.id === id), 1);
        renderTudo();
        return;
      }
      if (modoEdicao) return;
      const t = itens.find(i => i.id === id);
      t.feita = !t.feita;
      renderTudo();
    });

    listaEl.addEventListener('input', e => {
      if (!e.target.classList.contains('edit-nome')) return;
      const id = Number(e.target.closest('.tarefa').dataset.id);
      const novo = e.target.value.trim();
      if (novo) itens.find(i => i.id === id).nome = novo;
    });

    btnEditar.addEventListener('click', () => {
      modoEdicao = !modoEdicao;
      btnEditar.textContent = modoEdicao ? 'Concluir' : 'Editar';
      renderTudo();
    });

    btnAdd.addEventListener('click', () => {
      form.classList.toggle('aberto');
      document.getElementById('f-nome').focus();
    });
    document.getElementById('btn-cancelar').addEventListener('click', () => {
      form.reset(); form.classList.remove('aberto');
    });
    form.addEventListener('submit', e => {
      e.preventDefault();
      itens.push({
        id: proxId++,
        tipo: 'tarefa',
        nome: document.getElementById('f-nome').value.trim(),
        area: document.getElementById('f-area').value,
        data: diaSelecionado,
        feita: false,
        rotulo: 'Tarefa'
      });
      form.reset(); form.classList.remove('aberto');
      renderTudo();
    });

    function renderCalendario() {
      const ano = mesVisivel.getFullYear(), mes = mesVisivel.getMonth();
      document.getElementById('mes-nome').textContent =
        mesVisivel.toLocaleDateString('pt-BR', { month: 'long' }) + ' ' + ano;

      const primeiroDow = new Date(ano, mes, 1).getDay();
      const totalDias = new Date(ano, mes + 1, 0).getDate();
      const corpo = document.getElementById('cal-corpo');
      let html = '', dia = 1;

      for (let semana = 0; dia <= totalDias; semana++) {
        html += '<tr>';
        for (let dow = 0; dow < 7; dow++) {
          if ((semana === 0 && dow < primeiroDow) || dia > totalDias) {
            html += '<td class="vazia"></td>';
            continue;
          }
          const d = new Date(ano, mes, dia);
          const k = chave(d);
          const doDia = itens.filter(i => i.data === k);

          const classes = [];
          if (doDia.length) classes.push('tem');
          if (k === chaveHoje) classes.push('hoje');
          if (k < chaveHoje) classes.push('passado');
          if (k === diaSelecionado) classes.push('sel');

          const marcas = doDia.map(i => {
            let iconeCls = 'fi-rr-book-alt';
            if (i.tipo === 'prova') iconeCls = 'fi-rr-edit';
            else if (i.tipo === 'evento') iconeCls = 'fi-rr-calendar';
            return `<span class="marca ${i.tipo}"><i class="fi ${iconeCls}"></i></span>`;
          }).join('');

          html += `<td class="${classes.join(' ')}" data-k="${k}">
        ${marcas ? `<div class="marcas">${marcas}</div>` : ''}
        <span class="num">${String(dia).padStart(2, '0')}</span>
      </td>`;
          dia++;
        }
        html += '</tr>';
      }
      corpo.innerHTML = html;
    }

    document.getElementById('cal-corpo').addEventListener('click', e => {
      const td = e.target.closest('td[data-k]');
      if (!td) return;
      diaSelecionado = td.dataset.k;
      form.reset(); form.classList.remove('aberto');
      renderCalendario();
      renderPainel();
    });

    document.getElementById('mes-ant').addEventListener('click', () => {
      mesVisivel = new Date(mesVisivel.getFullYear(), mesVisivel.getMonth() - 1, 1);
      renderCalendario();
    });
    document.getElementById('mes-prox').addEventListener('click', () => {
      mesVisivel = new Date(mesVisivel.getFullYear(), mesVisivel.getMonth() + 1, 1);
      renderCalendario();
    });

    const btnMenu = document.getElementById('btn-menu');

    btnMenu.addEventListener('click', () => {
      document.body.classList.toggle('menu-fechado');
    });

    function renderTudo() {
      renderEventos();
      renderCalendario();
      renderPainel();
    }
    renderTudo();
  </script>
</body>

</html>
