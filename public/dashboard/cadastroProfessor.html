<div class="conteudo">
  <h1 class="titulo">Cadastro de <span>Professor</span></h1>

  <div class="card form-card">
    <form id="form-professor">
      <div class="form-grupo">
        <label>Nome Completo:</label>
        <input type="text" id="p-nome" required placeholder="Ex.: Carlos Alberto Souza">
      </div>

      <div class="form-linha">
        <div class="form-grupo">
          <label>E-mail Institucional:</label>
          <input type="email" id="p-email" required placeholder="carlos.souza@growthmap.com">
        </div>
        <div class="form-grupo">
          <label>CPF:</label>
          <input type="text" id="p-cpf" required placeholder="000.000.000-00">
        </div>
      </div>

      <div class="form-linha">
        <div class="form-grupo">
          <label>Área de Atuação:</label>
          <select id="p-area" required>
            <option value="">Selecione a área...</option>
            <option value="Ciências Exatas">Ciências Exatas</option>
            <option value="Ciências Naturais">Ciências Naturais</option>
            <option value="Ciências Humanas">Ciências Humanas</option>
            <option value="Linguagens">Linguagens</option>
          </select>
        </div>

        <div class="form-grupo">
          <label>Filial Vinculada:</label>
          <select id="p-filial" required>
            <option value="">Selecione a filial...</option>
            <option value="1">Growth Map - Unidade Centro</option>
            <option value="2">Growth Map - Unidade Paulista</option>
            <option value="3">Growth Map - Unidade ABC</option>
          </select>
        </div>
      </div>

      <div class="form-acoes">
        <button type="submit" class="btn-salvar">Cadastrar Professor</button>
        <button type="reset" class="btn-limpar">Limpar</button>
      </div>
    </form>
  </div>
</div>
