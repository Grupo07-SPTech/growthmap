<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Growth Map | Gerenciamento de Usuários</title>
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/usuarios.css">
    <link rel="icon" href="../assets/logo/logos-sem-fundo/logo_com_escrita_all-branco.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body onload="atualizarPagina()">
 <button class="btn-menu" id="btn-menu" aria-label="Abrir ou fechar menu">
    <i class="fi fi-rr-menu-burger"></i>
  </button>

  <div class="sidebar">
    <img class="logo" src="../assets/logo/logos-sem-fundo/logo_com_escrita_vermelho.png" alt="Logo">
    <div class="nav-indicador" id="nav-indicador"></div>

    <div class="nav-item">
      <a href="./acessoRapido.html"><i class="fi fi-rr-apps"></i></a>
    </div>
    <div class="nav-item">
      <a href="./painelEventos.html"><i class="fi fi-rr-calendar"></i></a>
    </div>
    <div class="nav-item">
      <a href="./filiais.html"><i class="fi fi-rr-home"></i></a>
    </div>
    <div class="nav-item">
      <a href="./dashboardDiretorGeral.html"><i class="fi fi-rr-chart-pie-alt"></i></a>
    </div>
    <div class="nav-item ativo">
      <a href="./usuarios.html"><i class="fi fi-rr-users"></i></a>
    </div>
    <a href="perfilUsuario.html">
      <div class="perfil"></div>
    </a>
    <div class="sair"><a href="../index.html">Sair</a></div>
  </div>

  <div class="conteudo">
    <div class="topo-pagina">
      <h1 class="titulo">Gerenciamento de <span>Utilizadores</span></h1>
      <div class="acoes-topo">
        <a href="permissoes.html" class="btn-acao-topo permissao"><i class="fi fi-rr-lock"></i> Gerenciar Permissões</a>
        <a href="cadastroUsuario.html">
          <button type="button" id="btn-novo-usuario" class="btn-acao-topo"><i class="fi fi-rr-user-add"></i>Adicionar Usuário</button>
        </a>
      </div>
    </div>

    <!-- Barra de Filtros Funcionais -->
    <div class="filtros-container">
      <div class="filtro-grupo">
        <label>Pesquisar por Nome ou E-mail:</label>
        <input type="text" id="filtro-busca" placeholder="Digite para pesquisar..." oninput="filtrarUsuarios()">
      </div>
      <div class="filtro-grupo">
        <label>Filtrar por Filial:</label>
        <select id="filtro-filial" onchange="filtrarUsuarios()">
          <option value="">Todas as filiais</option>
        </select>
      </div>
      <div class="filtro-grupo">
        <label>Filtrar por Cargo:</label>
        <select id="filtro-cargo" onchange="filtrarUsuarios()">
          <option value="">Todos os cargos</option>
        </select>
      </div>
      <div class="filtro-grupo">
        <label>Filtrar por Área de Atuação:</label>
        <select id="filtro-area" onchange="filtrarUsuarios()">
          <option value="">Todas as áreas</option>
        </select>
      </div>
    </div>

    <div class="card tabela-card">
      <table class="tabela-dados">
        <thead>
          <tr>
            <th>Nome</th>
            <th>E-mail</th>
            <th>Cargo</th>
            <th>Área de Atuação</th>
            <th>Filial</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tabela-usuarios">
          <!-- Conteúdo populado dinamicamente via JavaScript -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal de Edição -->
  <div id="modal-editar" class="modal" style="display: none;">
    <div class="modal-conteudo card">
      <h2>Editar Utilizador</h2>
      <input type="hidden" id="edit-id">
      
      <label>Nome:</label>
      <input type="text" id="edit-nome" class="input-modal">

      <label>E-mail:</label>
      <input type="email" id="edit-email" class="input-modal">

      <label>CPF:</label>
      <input type="text" id="edit-cpf" class="input-modal">

      <label>Cargo:</label>
      <select id="edit-cargo" class="input-modal"></select>

      <label>Área de Atuação:</label>
      <input type="text" id="edit-area" class="input-modal">

      <label>Filial:</label>
      <select id="edit-filial" class="input-modal"></select>

      <div class="form-acoes" style="margin-top: 20px;">
        <button type="button" class="btn-salvar" onclick="salvarEdicao()">Salvar</button>
        <button type="button" class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
      </div>
    </div>
  </div>

<script src="../js/menu.js"></script>
<script>
  let listaUsuariosGlobal = [];
  let listaFiliaisGlobal = [];

  function atualizarPagina() {
    let idEmpresa = sessionStorage.getItem("ID_EMPRESA");

    if (!idEmpresa || idEmpresa === "undefined" || idEmpresa === "null") {
      alert("Sessão expirada. Faça login novamente.");
      window.location.href = "../index.html";
      return;
    }

    fetch(`/filial/listar/${idEmpresa}`)
      .then(res => res.json())
      .then(filiais => {
        listaFiliaisGlobal = filiais;
        popularSelectFiliaisFiltro();
        popularSelectFiliaisEdicao();
        return fetch(`/professor/listar/${idEmpresa}`);
      })
      .then(res => res.json())
      .then(usuarios => {
        listaUsuariosGlobal = usuarios;
        exibirUsuarios(listaUsuariosGlobal);
        popularSelectsDinamicos(listaUsuariosGlobal);
      })
      .catch(err => console.error("Erro ao carregar dados: ", err));
  }

  function exibirUsuarios(usuarios) {
    let tbody = document.getElementById("tabela-usuarios");
    tbody.innerHTML = "";

    if (usuarios.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" style="text-align: center;">Nenhum utilizador encontrado com os filtros selecionados.</td></tr>`;
      return;
    }

    let cargoLogado = sessionStorage.getItem("CARGO_USUARIO") || "";
    let ehDiretorGeralOuAdmin = cargoLogado === "Diretor Geral" || cargoLogado === "Administrador";
    let ehDiretorFilial = cargoLogado === "Diretor";
    let temPermissao = ehDiretorGeralOuAdmin || ehDiretorFilial;

    for (let i = 0; i < usuarios.length; i++) {
      let usuario = usuarios[i];

      let botoesAcoes = temPermissao ? `
        <button class="btn-acao editar" title="Editar" onclick="abrirModal(${usuario.id})"><i class="fi fi-rr-edit"></i> Editar</button>
        <button class="btn-acao excluir" title="Excluir" onclick="excluirUsuario(${usuario.id})"><i class="fi fi-rr-trash"></i> Excluir</button>
      ` : `<span style="color: #888; font-size: 13px;">Apenas visualização</span>`;

      tbody.innerHTML += `
        <tr>
          <td>${usuario.nome}</td>
          <td>${usuario.email}</td>
          <td>${usuario.cargo || 'Professor'}</td>
          <td>${usuario.area_atuacao || '-'}</td>
          <td>${usuario.nome_unidade || '-'} (${usuario.nome_municipio || '-'})</td>
          <td>${botoesAcoes}</td>
        </tr>
      `;
    }
  }

  function popularSelectFiliaisFiltro() {
    let select = document.getElementById("filtro-filial");
    select.innerHTML = `<option value="">Todas as filiais</option>`;
    for (let i = 0; i < listaFiliaisGlobal.length; i++) {
      let filial = listaFiliaisGlobal[i];
      select.innerHTML += `<option value="${filial.id}">${filial.nome}</option>`;
    }
  }

  function popularSelectsDinamicos(usuarios) {
    let selectCargo = document.getElementById("filtro-cargo");
    let selectArea = document.getElementById("filtro-area");

    let cargosUnicos = [];
    let areasUnicas = [];

    selectCargo.innerHTML = `<option value="">Todos os cargos</option>`;
    selectArea.innerHTML = `<option value="">Todas as áreas</option>`;

    for (let i = 0; i < usuarios.length; i++) {
      let cargo = usuarios[i].cargo || 'Professor';
      let area = usuarios[i].area_atuacao;

      if (cargo && !cargosUnicos.includes(cargo)) {
        cargosUnicos.push(cargo);
        selectCargo.innerHTML += `<option value="${cargo}">${cargo}</option>`;
      }
      if (area && !areasUnicas.includes(area)) {
        areasUnicas.push(area);
        selectArea.innerHTML += `<option value="${area}">${area}</option>`;
      }
    }
  }

  function filtrarUsuarios() {
    let textoBusca = document.getElementById("filtro-busca").value.toLowerCase();
    let filialSelecionada = document.getElementById("filtro-filial").value;
    let cargoSelecionado = document.getElementById("filtro-cargo").value;
    let areaSelecionada = document.getElementById("filtro-area").value;

    let usuariosFiltrados = listaUsuariosGlobal.filter(function (usuario) {
      let nomeMatch = usuario.nome.toLowerCase().includes(textoBusca) || usuario.email.toLowerCase().includes(textoBusca);
      let filialMatch = filialSelecionada === "" || usuario.id_unidade == filialSelecionada;
      let cargoUser = usuario.cargo || 'Professor';
      let cargoMatch = cargoSelecionado === "" || cargoUser === cargoSelecionado;
      let areaMatch = areaSelecionada === "" || usuario.area_atuacao === areaSelecionada;

      return nomeMatch && filialMatch && cargoMatch && areaMatch;
    });

    exibirUsuarios(usuariosFiltrados);
  }

  function popularSelectFiliaisEdicao() {
    let select = document.getElementById("edit-filial");
    select.innerHTML = "";
    for (let i = 0; i < listaFiliaisGlobal.length; i++) {
      let filial = listaFiliaisGlobal[i];
      select.innerHTML += `<option value="${filial.id}">${filial.nome}</option>`;
    }
  }

  function abrirModal(id) {
    let usuario = listaUsuariosGlobal.find(u => u.id == id);
    if (!usuario) return;

    document.getElementById("edit-id").value = usuario.id;
    document.getElementById("edit-nome").value = usuario.nome;
    document.getElementById("edit-email").value = usuario.email;
    document.getElementById("edit-cpf").value = usuario.cpf || "";
    document.getElementById("edit-area").value = usuario.area_atuacao || "Ciências Exatas";
    document.getElementById("edit-filial").value = usuario.id_unidade;

    let cargoLogado = sessionStorage.getItem("CARGO_USUARIO") || "Diretor";
    let selectCargo = document.getElementById("edit-cargo");
    selectCargo.innerHTML = "";

    fetch("/permissoes/cargos")
    .then(function (resposta) {
        return resposta.json();
    })
    .then(function (cargos) {
        selectCargo.innerHTML = "";

        for (var i = 0; i < cargos.length; i++) {
            selectCargo.innerHTML += `
                <option value="${cargos[i].nome}">
                    ${cargos[i].nome}
                </option>
            `;
        }

        selectCargo.value = usuario.cargo;
    })
    .catch(function (erro) {
        console.log(erro);
    });

    document.getElementById("edit-cargo").value = usuario.cargo || "Professor";
    document.getElementById("modal-editar").style.display = "flex";
  }

  function fecharModal() {
    document.getElementById("modal-editar").style.display = "none";
  }

  function salvarEdicao() {
    let id = document.getElementById("edit-id").value;
    let nome = document.getElementById("edit-nome").value;
    let email = document.getElementById("edit-email").value;
    let cpf = document.getElementById("edit-cpf").value.replace(/\D/g, "");
    let cargo = document.getElementById("edit-cargo").value;
    let area = document.getElementById("edit-area").value;
    let idUnidade = document.getElementById("edit-filial").value;
    let cargoUsuarioLogado = sessionStorage.getItem("CARGO_USUARIO");

    fetch(`/professor/atualizar/${id}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ nome, email, cpf, cargo, area, idUnidade, cargoUsuarioLogado })
    })
      .then(res => {
        if (res.ok) {
          alert("Utilizador e permissões atualizados com sucesso!");
          fecharModal();
          atualizarPagina();
        } else {
          res.text().then(texto => alert(texto));
        }
      })
      .catch(err => console.error("Erro: ", err));
  }

  function excluirUsuario(id) {
    if (confirm("Tem certeza de que deseja excluir este utilizador?")) {
      fetch(`/professor/deletar/${id}`, { method: "DELETE" })
        .then(res => {
          if (res.ok) {
            alert("Utilizador excluído com sucesso!");
            atualizarPagina();
          } else {
            alert("Erro ao excluir o utilizador.");
          }
        })
        .catch(err => console.error("Erro: ", err));
    }
  }
</script>

<script src="../js/controleAcesso.js"></script>
</body>
</html>
