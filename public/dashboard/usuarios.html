  <div class="card filtros-card">
    <div class="filtros-grid">
      <div class="form-grupo">
        <label>Município:</label>
        <select id="filtro-municipio">
          <option value="">Todos os municípios</option>
          <option value="Santo André">Santo André</option>

        <label>Área:</label>
        <select id="filtro-area">
          <option value="">Todas as áreas</option>
          <option value="Ciências Exatas">Ciências Exatas</option>
          <option value="Ciências Naturais">Ciências Naturais</option>
          <option value="Ciências Humanas">Ciências Humanas</option>
          <option value="Linguagens">Linguagens</option>
        </select>
      </div>

      <div class="form-grupo">
        <label>Cargo:</label>
        <select id="filtro-cargo">
          <option value="">Todos os cargos</option>
          <option value="Professor">Professor</option>
          <option value="Diretor">Diretor</option>
          <option value="Coordenador">Coordenador</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card tabela-card">
    <table class="tabela-dados">
      <thead>
        <tr>
          <th>Nome</th>
          <th>E-mail</th>
