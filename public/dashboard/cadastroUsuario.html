<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Growth Map | Cadastro de Professor</title>
  <link rel="stylesheet"
    href="https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
  <link rel="stylesheet" href="./css/cadastroUsuario.css">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="icon" href="./assets/logo/logos-sem-fundo/logo_com_escrita_all-branco.png">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body onload="carregarFiliais(); carregarCargos()">

  <button class="btn-menu" id="btn-menu" aria-label="Abrir ou fechar menu">
    <i class="fi fi-rr-menu-burger"></i>
  </button>
  <div class="sidebar">
    <img class="logo" src="../assets/logo/logos-sem-fundo/logo_com_escrita_vermelho.png" alt="Logo">
    <div class="nav-indicador" id="nav-indicador"></div>

    <div class="nav-item">
      <a href="./acessoRapido.html"><i class="fi fi-rr-apps"></i></a>
    </div>
    <div class="nav-item">
      <a href="./painelEventos.html"><i class="fi fi-rr-calendar"></i></a>
    </div>
    <div class="nav-item">
      <a href="./filiais.html"><i class="fi fi-rr-home"></i></a>
    </div>
    <div class="nav-item">
      <a href="./dashboardProfessor.html"><i class="fi fi-rr-chart-pie-alt"></i></a>
    </div>
    <div class="nav-item ativo">
      <a href="./usuarios.html"><i class="fi fi-rr-users"></i></a>
    </div>
    <a href="perfilUsuario.html">
      <div class="perfil"></div>
    </a>
    <div class="sair"><a href="../index.html">Sair</a></div>
  </div>

  <div class="conteudo">
    <h1 class="titulo">Cadastro de <span>Usuário</span></h1>

    <div class="card form-card">
      <form id="form-professor" onsubmit="cadastrarProfessor(event)">
        <div class="form-grupo">
          <label>Nome Completo:</label>
          <input type="text" id="p-nome" required placeholder="Ex.: Carlos Alberto Souza">
        </div>

        <div class="form-linha">
          <div class="form-grupo">
            <label>E-mail Institucional:</label>
            <input type="email" id="p-email" required placeholder="carlos.souza@growthmap.com">
          </div>
          <div class="form-grupo">
            <label>CPF:</label>
            <input type="text" id="p-cpf" required placeholder="00000000000">
          </div>
        </div>

        <div class="form-linha">
          <div class="form-grupo">
            <label>Área de Atuação:</label>
            <select id="p-area" required>
              <option value="" disabled selected>Selecione a área...</option>
              <option value="Ciências Exatas">Ciências Exatas</option>
              <option value="Ciências Naturais">Ciências Naturais</option>
              <option value="Ciências Humanas">Ciências Humanas</option>
              <option value="Linguagens">Linguagens</option>
            </select>
          </div>

          <div class="form-grupo">
            <label>Filial Vinculada:</label>
            <select id="p-filial" required>
              <option value="" disabled selected>Selecione a filial...</option>
            </select>
          </div>
        </div>

        <div class="form-linha">
          <div class="form-grupo">
            <label>Cargo:</label>
            <select id="p-cargo" required>
              <option value="">Selecione o cargo...</option>
            </select>
          </div>

          <div class="form-grupo">
            <label>Senha inicial:</label>
            <input type="password" id="p-senha" required placeholder="Senha de acesso">
          </div>
        </div>

        <div class="form-acoes">
          <button type="submit" class="btn-salvar">Cadastrar Usuário</button>
          <button type="reset" class="btn-limpar">Limpar</button>
        </div>
      </form>
    </div>
  </div>

  <div id="modal-cadastro-sucesso" class="modal-sucesso" role="dialog" aria-modal="true" aria-labelledby="modal-sucesso-titulo" aria-describedby="modal-sucesso-mensagem">
    <div class="modal-sucesso-conteudo">
      <h2 id="modal-sucesso-titulo">Usuário cadastrado com sucesso!</h2>
      <p id="modal-sucesso-mensagem">Cargo: <strong id="modal-sucesso-cargo"></strong></p>
      <button type="button" class="btn-modal-sucesso" onclick="irParaUsuarios()">Ir para usuários</button>
    </div>
  </div>

  <script src="../js/menu.js"></script>
  <script>
    function carregarFiliais() {
      let idEmpresa = sessionStorage.getItem("ID_EMPRESA");

      if (!idEmpresa) {
        return;
      }

      fetch(`/filial/listar/${idEmpresa}`)
        .then(function (resposta) {
          if (resposta.ok) {
            resposta.json().then(function (filiais) {
              let selectFilial = document.getElementById("p-filial");
              selectFilial.innerHTML = `<option value="" disabled selected>Selecione a filial...</option>`;

              for (let i = 0; i < filiais.length; i++) {
                let filial = filiais[i];
                selectFilial.innerHTML += `<option value="${filial.id}">${filial.nome}</option>`;
              }
            });
          }
        })
        .catch(function (erro) {
          console.error("Erro ao carregar filiais: ", erro);
        });
    }

    function cadastrarProfessor(event) {
      event.preventDefault();

      let nome = document.getElementById("p-nome").value;
      let email = document.getElementById("p-email").value;
      let cpf = document.getElementById("p-cpf").value.replace(/\D/g, "");
      let area = document.getElementById("p-area").value;
      let idUnidade = document.getElementById("p-filial").value;
      var cargo = document.getElementById("p-cargo").value;
      var senha = document.getElementById("p-senha").value;

      fetch("/professor/cadastrar", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          nome: nome,
          email: email,
          cpf: cpf,
          area: area,
          idUnidade: idUnidade,
          cargo: cargo,
          senha: senha
        }),
      })
        .then(function (resposta) {
          if (resposta.ok) {
            document.getElementById("modal-sucesso-cargo").textContent = cargo;
            document.getElementById("modal-cadastro-sucesso").style.display = "flex";
          } else {
            resposta.text().then(function (texto) {
              alert(texto);
            });
          }
        })
        .catch(function (erro) {
          console.error("#ERRO:", erro);
          alert("Erro ao cadastrar usuário.");
        });
    }

    function irParaUsuarios() {
      window.location = "./usuarios.html";
    }

    function carregarCargos() {
      fetch("/permissoes/cargos")
        .then(function (resposta) {
          return resposta.json();
        })
        .then(function (cargos) {
          var select = document.getElementById("p-cargo");

          select.innerHTML = '<option value="">Selecione o cargo...</option>';

          for (var i = 0; i < cargos.length; i++) {
            select.innerHTML += `
                    <option value="${cargos[i].nome}">
                        ${cargos[i].nome}
                    </option>
                `;
          }
        })
        .catch(function (erro) {
          console.log(erro);
        });
    }
  </script>

  <script src="../js/controleAcesso.js"></script>
</body>

</html>
