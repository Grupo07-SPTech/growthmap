<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Growth Map | Gerenciamento de Permissões</title>
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/permissoes.css">
  <link rel="icon" href="../assets/logo/logos-sem-fundo/logo_com_escrita_all-branco.png">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

  <button class="btn-menu" id="btn-menu" aria-label="Abrir ou fechar menu">
    <i class="fi fi-rr-menu-burger"></i>
  </button>

  <div class="sidebar">
    <img class="logo" src="../assets/logo/logos-sem-fundo/logo_com_escrita_vermelho.png" alt="Logo">
    <div class="nav-indicador" id="nav-indicador"></div>

    <div class="nav-item">
      <a href="./acessoRapido.html"><i class="fi fi-rr-apps"></i></a>
    </div>
    <div class="nav-item">
      <a href="./painelEventos.html"><i class="fi fi-rr-calendar"></i></a>
    </div>
    <div class="nav-item">
      <a href="./filiais.html"><i class="fi fi-rr-home"></i></a>
    </div>
    <div class="nav-item">
      <a href="./dashboardDiretorGeral.html"><i class="fi fi-rr-chart-pie-alt"></i></a>
    </div>
    <div class="nav-item ativo">
      <a href="./usuarios.html"><i class="fi fi-rr-users"></i></a>
    </div>
    <a href="perfilUsuario.html">
      <div class="perfil"></div>
    </a>
    <div class="sair"><a href="../index.html">Sair</a></div>
  </div>

  <div class="conteudo">
    <div class="topo-pagina">
      <h1 class="titulo">Gerenciamento de <span>Permissões</span></h1>
      <button type="button" id="btn-abrir-modal" class="btn-acao-topo" style="background-color: #7b1e3a; color: #fff; border: none; border-radius: 8px; padding: 10px 18px; font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 8px;"><i class="fi fi-rr-plus"></i> Novo Cargo / Permissão</button>
    </div>

    <div class="card tabela-card">
      <table class="tabela-dados">
        <thead>
          <tr>
            <th>Cargo</th>
            <th>Nível de Acesso</th>
            <th>Módulos Permitidos</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tabela-permissoes-corpo">
          <tr>
            <td>Diretor Geral</td>
            <td><span class="badge administrativo">Administrativo</span></td>
            <td>Painel, Filiais, Gráficos, Usuários</td>
            <td>
              <div class="acoes-tabela">
                <button class="btn-acao editar" title="Editar"><i class="fi fi-rr-edit"></i> Editar</button>
                <button class="btn-acao excluir" title="Excluir"><i class="fi fi-rr-trash"></i> Excluir</button>
              </div>
            </td>
          </tr>
          <tr>
            <td>Professor</td>
            <td><span class="badge operacional">Operacional</span></td>
            <td>Painel de Eventos, Filiais</td>
            <td>
              <div class="acoes-tabela">
                <button class="btn-acao editar" title="Editar"><i class="fi fi-rr-edit"></i> Editar</button>
                <button class="btn-acao excluir" title="Excluir"><i class="fi fi-rr-trash"></i> Excluir</button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal de Cadastro / Edição corrigido (flutuante) -->
  <div id="modal-permissao" class="modal oculto">
    <div class="modal-conteudo">
      <h2 id="modal-titulo">Adicionar Novo Cargo</h2>
      <form id="form-permissao">
        <div class="form-grupo-modal">
          <label>Nome do Cargo:</label>
          <input type="text" id="inp-cargo" required placeholder="Ex.: Coordenador Pedagógico">
        </div>
        <div class="form-grupo-modal">
          <label>Nível de Acesso:</label>
          <select id="inp-nivel" required>
            <option value="Administrativo">Administrativo</option>
            <option value="Operacional">Operacional</option>
            <option value="Visualizador">Visualizador</option>
          </select>
        </div>
        <div class="form-grupo-modal">
          <label>Módulos Permitidos:</label>
          <div class="checkbox-grupo">
            <label><input type="checkbox" value="Painel de Eventos"> Painel de Eventos</label>
            <label><input type="checkbox" value="Filiais"> Filiais</label>
            <label><input type="checkbox" value="Gráficos / Dashboard"> Gráficos / Dashboard</label>
            <label><input type="checkbox" value="Gerenciamento de Usuários"> Gerenciamento de Usuários</label>
          </div>
        </div>
        <div class="form-acoes">
          <button type="submit" class="btn-salvar">Salvar</button>
          <button type="button" id="btn-fechar-modal" class="btn-cancelar">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/menu.js"></script>
  <script>
    const modal = document.getElementById('modal-permissao');
    const btnAbrir = document.getElementById('btn-abrir-modal');
    const btnFechar = document.getElementById('btn-fechar-modal');
    const form = document.getElementById('form-permissao');

    btnAbrir.addEventListener('click', () => modal.classList.remove('oculto'));
    btnFechar.addEventListener('click', () => modal.classList.add('oculto'));

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      alert("Cargo e permissões salvos com sucesso!");
      modal.classList.add('oculto');
      form.reset();
    });
  </script>
</body>
</html>
