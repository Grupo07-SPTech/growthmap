<!DOCTYPE html>
<html lang="pt-br">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Growth Map | Login</title>

   <link href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;700&family=Poppins:wght@400;600&display=swap"
      rel="stylesheet">
   <link rel="icon" href="./assets/logo/logos-sem-fundo/logo_com_escrita_all-branco.png">
   <link rel="stylesheet" href="./css/login.css">
</head>

<body>

   <div class="container">

      <div id="bloc1" class="login">
         <p class="texto-login">Bem-vindo(a)<br> de volta!</p>
         <div id="logoFundo"></div>
      </div>


      <div id="bloc2" class="login">
         <a href="index.html" class="link-logo" aria-label="Ir para a página inicial">
            <div id="logo"></div>
         </a>
         <div id="inputs">

            <div id="caixaEmail" class="caixa">
               <p class="tituloInp">Email:</p>
               <input id="inpEmail" class="input" type="text">
            </div>

            <div id="caixaSenha" class="caixa">
               <p class=" tituloInp">Senha:</p>
               <input id="inpSenha" class="input" type="password">
            </div>

         </div>

         <div class="caixa" id="caixaBotao">
            <button class="botao login" onclick="entrar()">ENTRAR</button>
            <p class="texto">Não tem uma conta? <b><a href="cadastro.html">Cadastre-se</a></b></p>
         </div>

      </div>
   </div>
   <script>

      function entrar() {
         var emailVar = inpEmail.value;
         var senhaVar = inpSenha.value;

         if (emailVar == "" || senhaVar == "") {
            alert("Preencha todos os campos!");
            return false;
         }

         fetch("/empresas/autenticar", {
            method: "POST",
            headers: {
               "Content-Type": "application/json"
            },
            body: JSON.stringify({
               email: emailVar,
               senha: senhaVar
            })
         })
            .then(function (resposta) {
               if (resposta.ok) {
                  resposta.json().then(function (empresa) {
                     sessionStorage.ID_EMPRESA = empresa.id;
                     sessionStorage.NOME_EMPRESA = empresa.nome;
                     sessionStorage.EMAIL_EMPRESA = empresa.email;
                     sessionStorage.CNPJ_EMPRESA = empresa.cnpj;

                     sessionStorage.setItem("CARGO_USUARIO", empresa.cargo || "Diretor Geral");
                     sessionStorage.setItem("NIVEL_ACESSO", "Administrativo");
                     sessionStorage.setItem("TIPO_CONTA", "empresa");

                     window.location = "./dashboard/acessoRapido.html";
                  });
               } else if (resposta.status == 403) {
                  // Se não for empresa, tenta como colaborador
                  fetch("/usuarios/autenticar", {
                     method: "POST",
                     headers: {
                        "Content-Type": "application/json"
                     },
                     body: JSON.stringify({
                        emailServer: emailVar,
                        senhaServer: senhaVar
                     })
                  })
                     .then(function (respostaUsuario) {
                        if (respostaUsuario.ok) {
                           respostaUsuario.json().then(function (usuario) {
                              sessionStorage.clear();

                              sessionStorage.ID_USUARIO = usuario.id;
                              sessionStorage.NOME_USUARIO = usuario.nome;
                              sessionStorage.EMAIL_USUARIO = usuario.email;
                              sessionStorage.ID_EMPRESA = usuario.empresaId;
                              sessionStorage.ID_UNIDADE = usuario.unidadeId;
                              sessionStorage.ID_CARGO = usuario.cargoId;
                              sessionStorage.CARGO_USUARIO = usuario.cargo;
                              sessionStorage.NIVEL_ACESSO = usuario.nivelAcesso;
                              sessionStorage.TIPO_CONTA = "usuario";

                              window.location = "./dashboard/acessoRapido.html";
                           });
                        } else {
                           alert("E-mail ou senha inválidos!");
                        }
                     })
                     .catch(function (erro) {
                        console.log(erro);
                        alert("Erro ao autenticar colaborador.");
                     });
               } else {
                  alert("Erro ao autenticar empresa.");
               }
            })
            .catch(function (erro) {
               console.log(erro);
               alert("Erro de conexão com o servidor.");
            });

         return false;
      }
   </script>


</body>

</html>
